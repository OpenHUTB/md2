name: Deploy Web (GitHub Pages)

# 推送 main 时，构建网页版并部署到 GitHub Pages（https://marsggbo.github.io/markdown2anything/）
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 构建网页版
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建 web 静态资源
        run: bash web/build.sh

      - name: 配置 Pages 上下文
        uses: actions/configure-pages@v6

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
